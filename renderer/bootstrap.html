<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>T3X Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bootstrap-body">

  <div class="titlebar">
    <span class="titlebar-title">T3X Launcher</span>
    <div class="titlebar-buttons">
      <button onclick="window.electronAPI.minimizeWindow()">─</button>
      <button onclick="window.electronAPI.closeWindow()" class="close-btn">✕</button>
    </div>
  </div>

  <div class="roblox-topbar">
    <span class="roblox-logo">T3X</span>
    <div class="roblox-nav">
      <span class="roblox-nav-item active">Home</span>
      <span class="roblox-nav-item">Catalog</span>
      <span class="roblox-nav-item">Develop</span>
    </div>
    <div class="roblox-search">
      <input type="text" placeholder="Search" class="roblox-search-input" />
      <button class="roblox-search-btn">🔍</button>
    </div>
    <div class="roblox-topbar-right">
      <span class="roblox-robux">R$ 999</span>
      <span class="roblox-icon">⚙</span>
      <span class="roblox-icon">👤</span>
    </div>
  </div>

  <div class="roblox-body">

    <div class="roblox-sidebar">
      <div class="sidebar-user">
        <div class="sidebar-avatar"></div>
        <span class="sidebar-username">User 067</span>
      </div>
      <div class="sidebar-menu">
        <div class="sidebar-item active">Home</div>
        <div class="sidebar-item">Profile</div>
        <div class="sidebar-item">Messages</div>
        <div class="sidebar-item">Friends <span class="sidebar-badge">65</span></div>
        <div class="sidebar-item">Avatar</div>
        <div class="sidebar-item">Inventory</div>
        <div class="sidebar-item">Trade</div>
        <div class="sidebar-item">Groups</div>
        <div class="sidebar-item">Blog</div>
        <div class="sidebar-item">Official Store</div>
        <div class="sidebar-item">Gift Cards</div>
      </div>
      <button class="upgrade-btn">Upgrade Now</button>
    </div>

    <div class="roblox-main">
      <h2 class="section-title">Continue</h2>

      <div class="games-row" id="continueRow">
        <div class="game-card" onclick="window.electronAPI.openLauncher()">
          <div class="game-card-thumb">
            <img src="thumbnail.png" alt="Studio" class="game-card-img">
          </div>
          <div class="game-card-title">Roblox Studio 2016M</div>
          <div class="game-card-meta">
            <span class="game-playing" id="studioPlaying">— Playing</span>
            <span class="game-rating">👍 100%</span>
          </div>
        </div>
      </div>

      <h2 class="section-title" style="margin-top: 20px;">Placeholders</h2>

      <div class="games-row" id="recommendedRow"></div>
    </div>

  </div>

  <script src="bootstrap.js"></script>
</body>
</html>
